name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Permissions, services and native WebRTC library
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/><application#' $M
          sed -i 's#</application>#<service android:name=".ScreenShareService" android:exported="false" android:foregroundServiceType="mediaProjection|microphone"/><service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="dataSync"/></application>#' $M
          sed -i '0,/^dependencies {/s##dependencies {\n    implementation "io.getstream:stream-webrtc-android:1.1.1"#' android/app/build.gradle
          cp native/*.java android/app/src/main/java/com/banaagjade/circle/
          grep -n "stream-webrtc" android/app/build.gradle
          grep -n "Service" $M
      - name: App icon (optional)
        run: npx --yes @capacitor/assets generate --android || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: circle-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
