/* Shrink big photos in the browser before upload: max 1600px on the long side, re-encoded as WebP (JPEG if the browser can't write WebP).
   GIFs, SVGs, videos and audio are left alone. If the result isn't smaller we keep the original. */
async function shrinkImage(file,max=1600,quality=.82){
  try{
    if(!file||!/^image\/(jpeg|png|webp|heic|heif)$/i.test(file.type))return file;
    let bmp;
    try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){return file}
    const sc=Math.min(1,max/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
    if(sc===1&&file.size<300*1024){bmp.close&&bmp.close();return file}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const cx=cv.getContext('2d');cx.drawImage(bmp,0,0,w,h);bmp.close&&bmp.close();
    let type='image/webp',blob=await new Promise(r=>cv.toBlob(r,type,quality));
    if(!blob||blob.type!=='image/webp'){type='image/jpeg';blob=await new Promise(r=>cv.toBlob(r,type,quality))}
    cv.width=cv.height=0;
    if(!blob||blob.size>=file.size)return file;
    const ext=type==='image/webp'?'.webp':'.jpg';
    return new File([blob],file.name.replace(/\.[^.]+$/,'')+ext,{type,lastModified:Date.now()});
  }catch(e){return file}
}

  const mark=()=>[...seg.children].forEach(b=>b.classList.toggle('on',b.dataset.k===LS.get('ap_theme','system')));
  [['system','Auto'],['light','Light'],['dark','Dark']].forEach(([k,l])=>{const b=el('button','g',l);b.type='button';b.dataset.k=k;b.onclick=()=>{LS.set('ap_theme',k);applyLook();mark()};seg.append(b)});mark();
  c.append(seg,el('div','mute','Auto follows your device’s light or dark setting.'));main.append(c);
  const a=el('div','card col');a.append(sti(SI.palette,'Accent colour'));const sw=el('div','swatches');
  const mk=()=>[...sw.children].forEach(b=>b.classList.toggle('on',b.dataset.k===LS.get('ap_ac','blue')));
  Object.keys(ACCENTS).forEach(k=>{const b=el('button','swc');b.type='button';b.dataset.k=k;b.style.background=ACCENTS[k][0];b.setAttribute('aria-label',k);b.onclick=()=>{LS.set('ap_ac',k);applyLook();mk()};sw.append(b)});mk();
  a.append(sw,toggle('Reduce motion and animations',LS.get('ap_calm','0')==='1',v=>{LS.set('ap_calm',v?'1':'0');applyLook()}),el('div','mute','Appearance is saved on this device only.'));main.append(a)}

async function stActivity(main){
  main.append(subh('Recently liked'));
  const {data:lk}=await sb.from('likes').select('created_at,posts(body,media_type,profiles!posts_user_id_fkey(username))').eq('user_id',me.id).order('created_at',{ascending:false}).limit(10);
  if(!(lk||[]).length)main.append(el('div','mute','Nothing yet.'));
  (lk||[]).forEach(x=>{if(x.posts)main.append(Object.assign(el('div','card mute'),{textContent:'♥ '+(x.posts.body||'('+(x.posts.media_type||'post')+')').slice(0,70)+' · '+x.posts.profiles.username+' · '+ago(x.created_at)}))});
  main.append(subh('Archive'));
  const {data:ar}=await sb.from('posts').select('*').eq('user_id',me.id).eq('archived',true).order('created_at',{ascending:false});
  if(!(ar||[]).length)main.append(el('div','mute','Nothing archived. Use Archive on your posts to hide them without deleting.'));
  (ar||[]).forEach(x=>{const c=el('div','card row');c.append(el('span',null,(x.body||'('+(x.media_type||'post')+')').slice(0,60)));const r=el('div'),rs=el('button','g','Restore'),de=el('button','g','Delete');
    rs.onclick=async()=>{await sb.from('posts').update({archived:false}).eq('id',x.id);render()};de.onclick=async()=>{if(confirm('Delete for good?')){await sb.from('posts').delete().eq('id',x.id);render()}};r.append(rs,de);c.append(r);main.append(c)});
  main.append(subh('Expired stories'));
  const {data:es}=await sb.from('stories').select('*').eq('user_id',me.id).lt('created_at',new Date(Date.now()-864e5).toISOString()).order('created_at',{ascending:false}).limit(30);
  if(!(es||[]).length)main.append(el('div','mute','Stories move here after 24 hours.'));
  (es||[]).forEach(x=>{const c=el('div','card row'),r=el('div'),sa=el('button','g','Share again'),de=el('button','g','Delete');c.append(el('span',null,(x.caption||'Story')+' · '+ago(x.created_at)));
    sa.onclick=async()=>{await sb.from('stories').update({created_at:new Date().toISOString()}).eq('id',x.id);render()};de.onclick=async()=>{await sb.from('stories').delete().eq('id',x.id);render()};r.append(sa,de);c.append(r);main.append(c)})}

function stLogins(main){
  const ss=el('div','card col');ss.append(sti(SI.dev,'Log-ins'),el('div','mute','Last sign-in: '+new Date(me.last_sign_in_at).toLocaleString()));
  const so=el('button','g','Sign out'),sa=el('button','g','Sign out on all devices');so.onclick=()=>sb.auth.signOut();sa.onclick=()=>{if(confirm('Sign out everywhere, including this device?'))sb.auth.signOut({scope:'global'})};
  const r=el('div','row');r.append(so,sa);ss.append(r);main.append(ss)}

function stData(main){
  const d=el('div','card col'),dl=el('button',null,'Download my information'),dm=el('div','mute');
  d.append(sti(SI.down,'Download your information'),el('div','mute','Get a JSON file with your profile, posts, comments, likes, follows, blocks and messages.'),dl,dm);main.append(d);
  dl.onclick=async()=>{dl.disabled=true;dm.textContent='Gathering your data…';
    const out={exported_at:new Date().toISOString(),account:{id:me.id,email:me.email,created_at:me.created_at},profile:mine};
    const q=async(k,p)=>{try{const r=await p;out[k]=r.data||[]}catch(e){out[k]=[]}};
    await Promise.all([q('posts',sb.from('posts').select('*').eq('user_id',me.id)),q('comments',sb.from('comments').select('*').eq('user_id',me.id)),q('likes',sb.from('likes').select('*').eq('user_id',me.id)),
      q('following',sb.from('follows').select('*').eq('follower',me.id)),q('followers',sb.from('follows').select('*').eq('followee',me.id)),q('blocks',sb.from('blocks').select('*').eq('blocker',me.id)),
      q('messages',sb.from('messages').select('*').or('sender.eq.'+me.id+',recipient.eq.'+me.id).order('created_at').limit(5000))]);
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='circle-my-information.json';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
    dl.disabled=false;dm.textContent='Downloaded.'};
  const s=el('div','card col'),cc=el('button','g','Clear app cache and reload');
  s.append(sti(SI.down,'Storage'),el('div','mute','If Circle looks out of date or acts strangely, clear its saved files. You stay signed in.'),cc);
  cc.onclick=async()=>{if(!confirm('Clear saved app files and reload?'))return;try{await Promise.all((await caches.keys()).map(k=>caches.delete(k)));await Promise.all((await navigator.serviceWorker.getRegistrations()).map(r=>r.unregister()))}catch(e){}location.reload()};
  if(deferredInstall){const ib=el('button',null,'Install Circle on this device');ib.onclick=async()=>{deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;render()};s.append(ib)}
  main.append(s)}

function stHelp(main){
  const FAQ=[['How do I change my username?','Open Account and security. You can change it once every 15 days, and it must be 3–20 characters: letters, numbers, _ and .'],
    ['How do I make my account private?','Open Privacy and safety and turn on Private account. Only followers you approve will see your posts and stories.'],
    ['How do I stop someone from contacting me?','Open their profile and tap Block. You can unblock people any time under Privacy and safety.'],
    ['Where did my stories and archived posts go?','Open Your activity. Stories move there after 24 hours and you can share them again; archived posts can be restored.'],
    ['I forgot my password.','Sign out, then use the “Reset password” option on the sign-in screen. We’ll email you a link.']];
  FAQ.forEach(([q,a])=>{const d=document.createElement('details');d.className='faq';const s=document.createElement('summary');s.textContent=q;d.append(s,el('p','mute',a));main.append(d)});
  main.append(el('div','mute','Circle · app version 20'))}

function stDanger(main){
  const d=el('div','card col stdel'),bt=el('button','g','Delete my account and data');d.append(sti(STI.bin,'Delete account'),el('div','mute','Permanently removes your profile, posts, messages and follows. This cannot be undone.'),bt);
  bt.onclick=async()=>{if(prompt('Type DELETE to permanently delete your account.')!=='DELETE')return;const r=await sb.rpc('delete_my_account');if(r.error)return alert(r.error.message+' (Run update6.sql in Supabase if you haven’t yet.)');await sb.auth.signOut();location.reload()};main.append(d)}

async function pSettings(main){
  main.classList.add('stg');main.append(el('h1','sh1','Settings'));
  const pc=el('div','card spc'),pr=el('div','sprof'),aa=avatar({...mine,id:me.id}),nm=el('div'),ch=el('span','sch');aa.onclick=null;ch.append(svg(SI.chev));
  nm.append(el('b',null,mine.username),el('div','mute',me.email));pr.append(aa,nm,ch);pr.onclick=()=>{viewUid=me.id;dmWith=null;go('profile')};
  pc.append(pr,sxRow(SI.user,'Edit profile',()=>{viewUid=me.id;dmWith=null;go('profile')},false));main.append(pc);
  main.append(el('div','sh2','Your shortcuts'));
  const g=el('div','stiles');
  [['saved','Saved'],['chats','Messages'],['notifs','Notifications'],['market','Marketplace'],['reels','Reels'],['profile','My profile']].forEach(([k,l])=>{const b=el('button','stile');b.type='button';b.append(ico(k),el('span',null,l));b.onclick=()=>{viewUid=null;dmWith=null;if(location.hash)history.replaceState(null,'',location.pathname);go(k)};g.append(b)});
  main.append(g);
  const L=el('div','card spc');main.append(L);
  sxAcc(L,'acct',SI.user,'Account and security',stAccount);
  sxAcc(L,'priv',SI.shield,'Privacy and safety',stPrivacy);
  sxAcc(L,'noti',SI.bell,'Notifications',stNotifs);
  sxAcc(L,'look',SI.palette,'Appearance',stLook);
  sxAcc(L,'lang',SI.globe,'Language',stLang);
  sxAcc(L,'act',SI.clock,'Your activity',stActivity);
  sxAcc(L,'logs',SI.dev,'Log-ins and sessions',stLogins);
  sxAcc(L,'data',SI.down,'Your information and storage',stData);
  sxAcc(L,'support',SI.help,'Customer service',stSupport);
  sxAcc(L,'help',SI.help,'Help and support',stHelp);
  L.append(sxRow(SI.help,'Terms and Conditions',showTerms,true));
  sxAcc(L,'del',SI.warn,'Delete account',stDanger);
  const lo=el('button','slogout','Log out');lo.type='button';lo.onclick=()=>sb.auth.signOut();main.append(lo);
}

/* ---------- Boot ---------- */
applyLook();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(SUPABASE_URL.includes('YOUR_')){app.append(Object.assign(el('div','auth'),{innerHTML:'<h1>Circle</h1><p>Almost there. Open <b>js/app.js</b> in a text editor and paste your Supabase URL and anon key at the top. See README.md.</p>'}))}
else{
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY')showNewPassword();else if(ev==='SIGNED_OUT'){me=null;showAuth()}else if(ev==='SIGNED_IN'&&!me)start()});
  (async()=>{try{if(localStorage.getItem('cr_rem')==='0'&&!sessionStorage.getItem('cr_alive'))await sb.auth.signOut()}catch(e){}start()})();
}
</script>
<script>
/* Loads the Supabase library (own copy, then jsDelivr, then unpkg), and only then starts the app. */
(function(){
  var srcs=['supabase.min.js?v=1','https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js','https://unpkg.com/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js'];
  function run(){var s=document.createElement('script');s.text=document.getElementById('circle-main').textContent;document.body.appendChild(s)}
  var bad=[];function fail(){var a=document.getElementById('app');if(a)a.innerHTML='<div style="padding:24px;font:16px system-ui;color:#c00">Circle could not load a required file.<br><small>Check your connection and reload.</small><br><small style="opacity:.7">Tried: '+bad.map(function(u){return u.replace(/^https:\/\//,'').split('/')[0]||u}).join(', ')+'</small><br><br><button onclick="location.reload()" style="padding:10px 16px;font:inherit">Try again</button></div>'}
  function next(i){
    if(window.supabase&&window.supabase.createClient)return run();
    if(i>=srcs.length)return fail();
    var t=document.createElement('script');t.src=srcs[i];
    t.onload=function(){if(window.supabase&&window.supabase.createClient)run();else{bad.push(srcs[i]);next(i+1)}};
    t.onerror=function(){bad.push(srcs[i]);next(i+1)};
    document.head.appendChild(t);
  }
  next(0);
})();
</script>
